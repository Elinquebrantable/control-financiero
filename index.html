<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control Financiero Familiar</title>
<meta name="description" content="Lleva el registro de tus gastos, ingresos, deudas y ahorros, con un reto cada semana.">
<meta name="theme-color" content="#14304a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Control">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <p class="hola" id="hola"></p>
    <h1 id="titulo">Inicio</h1>
  </div>
  <button class="icono" id="btnAjustes" type="button" aria-label="Ajustes">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
</header>

<main id="vista"></main>

<nav class="tabs" id="tabs">
  <button type="button" data-ir="inicio" class="activo" aria-label="Inicio">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    <span>Inicio</span>
  </button>
  <button type="button" data-ir="ingresos" aria-label="Ingresos">
    <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
    <span>Ingresos</span>
  </button>
  <button type="button" data-ir="deudas" aria-label="Deudas">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>
    <span>Deudas</span>
  </button>
  <button type="button" data-ir="ahorros" aria-label="Ahorros">
    <svg viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M21 7h-6a3 3 0 0 0 0 6h6z"/><circle cx="16" cy="10" r=".8"/></svg>
    <span>Ahorros</span>
  </button>
  <button type="button" data-ir="retos" aria-label="Progreso">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Progreso</span>
  </button>
</nav>

<button type="button" id="btnMas" class="fab" aria-label="Registrar">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="fondo" id="fondo" hidden>
  <section class="hoja" id="hoja" role="dialog" aria-modal="true"></section>
</div>

<div class="aviso" id="aviso" hidden></div>

<script src="app.js"></script>
</body>
</html>
