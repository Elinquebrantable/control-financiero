<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control Financiero Familiar</title>
<meta name="description" content="Lleva el registro de tus gastos, ingresos, deudas y ahorros, con un reto cada semana.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Control Financiero Familiar">
<meta property="og:title" content="Control Financiero Familiar (Beta) · Sal de deudas y haz crecer tu hogar">
<meta property="og:description" content="Beta gratis: gastos, deudas, ahorros e ingresos de tu casa en un solo lugar. Tus datos se quedan en tu teléfono.">
<meta property="og:url" content="https://app.tribuinquebrantable.com/">
<meta property="og:image" content="https://app.tribuinquebrantable.com/icons/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="es_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#14304a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Control">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div>
    <p class="hola" id="hola"></p>
    <h1 class="titulo-fila"><span id="titulo">Inicio</span><span class="beta">Beta</span></h1>
  </div>
  <button class="icono" id="btnAjustes" type="button" aria-label="Ajustes">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
</header>

<main id="vista"></main>

<nav class="tabs" id="tabs">
  <button type="button" data-ir="inicio" class="activo" aria-label="Inicio">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    <span>Inicio</span>
  </button>
  <button type="button" data-ir="ingresos" aria-label="Ingresos">
    <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
    <span>Ingresos</span>
  </button>
  <button type="button" data-ir="deudas" aria-label="Deudas">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>
    <span>Deudas</span>
  </button>
  <button type="button" data-ir="ahorros" aria-label="Ahorros">
    <svg viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M21 7h-6a3 3 0 0 0 0 6h6z"/><circle cx="16" cy="10" r=".8"/></svg>
    <span>Ahorros</span>
  </button>
  <button type="button" data-ir="retos" aria-label="Progreso">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Progreso</span>
  </button>
</nav>

<button type="button" id="btnMas" class="fab" aria-label="Registrar">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="fondo" id="fondo" hidden>
  <section class="hoja" id="hoja" role="dialog" aria-modal="true"></section>
</div>

<div class="aviso" id="aviso" hidden></div>

<script>
/* Red de seguridad: si la app no termina de cargar, en vez de una pantalla vacía se ofrece reintentar.
   Reintentar borra solo las copias de la app, nunca tus datos (esos viven aparte en el teléfono). */
window.__cffErrores = [];
addEventListener('error', function (e) { __cffErrores.push((e.message || 'error') + ' · ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '')); });
setTimeout(function () {
  if (window.__cffListo) return;
  var v = document.getElementById('vista');
  if (!v) return;
  v.innerHTML = '<div class="card" style="margin-top:12px"><h2>😕 La app no terminó de cargar</h2>' +
    '<p class="ayuda">Tus datos están a salvo en este teléfono. Puede ser la señal. Toca Reintentar.</p>' +
    '<button class="btn principal ancho" id="cffReintentar">Reintentar</button>' +
    '<p class="ayuda" style="font-size:11px;opacity:.7;margin-top:12px">Detalle: ' + (__cffErrores.join(' | ') || 'sin error, tardó demasiado').replace(/</g, '&lt;') + '</p></div>';
  document.getElementById('cffReintentar').onclick = function () {
    var listo = function () { location.reload(); };
    if (window.caches) caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }).then(listo, listo); else listo();
  };
}, 6000);
</script>
<script src="app.js"></script>
</body>
</html>
